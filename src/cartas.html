<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="cartas.js"></script>
</head>

<body style="margin: 0;">
    <canvas></canvas>

    <script>

        const canvas = document.querySelector('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 600;

        let cartaSelecionada = null;
        const cartas = [];
        const tileSize = 10;

        const mouse = {
            x: undefined,
            y: undefined,
            // press: false
        }
        // canvas.addEventListener('mouseup', (e) => mouse.press = false)
        canvas.addEventListener('mousedown', (e) => {
            const cardSelected = mao.cartas.find(x => x.selected);
            if (cardSelected)
                cardSelected.toggleSelect();

            const card = mao.cartas.find(x => x.isMouseOver());
            if (card)
                card.toggleSelect()

            if (tabuleiro.isMouseOver() && cardSelected) {
                const cartaDaMesa = tabuleiro.cartasNaMesa.find(x => x.isMouseOver());
                if (cartaDaMesa)
                    tabuleiro.addCard(cardSelected, cartaDaMesa)
            }
        })
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        })

        class Carta {
            constructor(x, y, mapa) {
                this.x = x;
                this.y = y;
                this.map = mapa;

                const h = mapa.length;
                const w = mapa[0].length;
                this.width = (w * tileSize);
                this.height = (h * tileSize);

                this.selected = false;

                this.possiveisConexoes = [];
            }

            draw() {
                // const size = this.selected ? tileSize * 2 : tileSize
                for (let i = 0; i < this.map.length; i++) {
                    const row = this.map[i];
                    for (let j = 0; j < row.length; j++) {
                        const tile = row[j];

                        const x = this.x + j * tileSize;
                        let y = this.y + i * tileSize;

                        if (this.selected)
                            y -= 20

                        // if (this.isMouseOver())
                        //     ctx.fillStyle = 'rgb(0,255,0)';
                        if (this.possiveisConexoes.findIndex(item => item.y == i && item.x == j) > -1)
                            ctx.fillStyle = 'rgb(125,125,0)';
                        else if (this.isMouseOverTile(x, y))
                            ctx.fillStyle = 'rgb(0,255,0)';
                        else if (tile == 0)
                            ctx.fillStyle = 'brown'
                        else if (tile == 1)
                            ctx.fillStyle = 'red'
                        else if (tile == 2)
                            ctx.fillStyle = 'blue';
                        else
                            ctx.fillStyle = 'yellow';

                        ctx.fillRect(x, y, tileSize, tileSize)
                    }
                }
            }

            update(verificarMatch = false) {
                // if (this.isMouseOver() && mouse.press)
                //     this.selected = true;
                // else
                //     this.selected = false;

                if (cartaSelecionada && verificarMatch) {
                    this.possiveisConexoes = [];

                    const mfrow = this.firstRow()
                    const slrow = cartaSelecionada.lastRow();
                    let match = this.compareArrays(mfrow, slrow);
                    if (match)
                        for (let i = 0; i < match.length; i++)
                            this.possiveisConexoes.push({
                                x: match[i],
                                y: 0
                            })

                    const mlrow = this.lastRow()
                    const sfrow = cartaSelecionada.firstRow();
                    match = this.compareArrays(mlrow, sfrow);
                    if (match)
                        for (let i = 0; i < match.length; i++)
                            this.possiveisConexoes.push({
                                x: match[i],
                                y: this.map.length - 1
                            })

                    const mfcolumn = this.firstColumn()
                    const slcolumn = cartaSelecionada.lastColumn();
                    match = this.compareArrays(mfcolumn, slcolumn);
                    if (match)
                        for (let i = 0; i < match.length; i++)
                            this.possiveisConexoes.push({
                                x: 0,
                                y: match[i]
                            })

                    const mlcolumn = this.lastColumn()
                    const sfcolumn = cartaSelecionada.firstColumn();
                    match = this.compareArrays(mlcolumn, sfcolumn);
                    if (match)
                        for (let i = 0; i < match.length; i++)
                            this.possiveisConexoes.push({
                                x: this.map[0].length - 1,
                                y: match[i]
                            })
                }

                this.draw()
            }

            compareArrays(a1, a2) {
                if (!this.temConexaoDisponivel(a1) && !this.temConexaoDisponivel(a2))
                    return null

                //arrays de mesmo tamanho
                if (a1.length == a2.length) {
                    for (let i = 0; i < a1.length; i++)
                        if (a1[i] != a2[i])
                            return null;

                    const matchs = []
                    for (let i = 0; i < a1.length; i++)
                        if (a1[i] == 1)
                            matchs.push(i);
                    return matchs
                }
                //arrays de tamanho diferente
                else {
                    const meuEhOMaior = a1.length > a2.length ? true : false
                    const maior = a1.length > a2.length ? a1 : a2;
                    const menor = a1.length < a2.length ? a1 : a2;

                    const matchs = []
                    for (let i = 0; i < maior.length; i = i + 3) {

                        let match = true;
                        const metadeMaior = [maior[i], maior[i + 1], maior[i + 2]];
                        for (let j = 0; j < menor.length; j++)
                            if (metadeMaior[i] != menor[j])
                                match = false;

                        if (match)
                            if (meuEhOMaior)
                                /*
                                somo com o i para ajustar para segunda metade do maior
                                no começo o i = 0 e na proxima i = 3
                                */
                                matchs.push(metadeMaior.findIndex(x => x == 1) + i);
                            else
                                matchs.push();
                    }

                    return matchs.length > 0 ? matchs : null
                }
            }

            temConexaoDisponivel(a1) {
                return a1.findIndex(x => x == 1) > -1;
            }

            toggleSelect() {
                this.selected = !this.selected;
                if (this.selected)
                    cartaSelecionada = this;
                else
                    cartaSelecionada = null;
            }

            firstRow() {
                return this.map[0]
            }

            lastRow() {
                return this.map[this.map.length - 1]
            }

            firstColumn() {
                const column = []
                this.map.forEach(row => column.push(row[0]))
                return column;
            }

            lastColumn() {
                const column = []
                this.map.forEach(row => column.push(row[row.length - 1]))
                return column;
            }

            isMouseOverTile(x, y) {
                if (mouse.x > x && mouse.x < x + tileSize &&
                    mouse.y > y && mouse.y < y + tileSize)
                    return true;
                else
                    return false;
            }

            isMouseOver() {
                if (mouse.x > this.x && mouse.x < this.x + this.width &&
                    mouse.y > this.y && mouse.y < this.y + this.height)
                    return true;
                else
                    return false;
            }
        }

        let offsetX = 10, offsetY = 10, interator = 0;
        for (const cardAttr in cartasMap) {
            const x = interator * (tileSize * 4) + offsetX;
            cartas.push(new Carta(x, offsetY, cartasMap[cardAttr]));
            interator++;
        }

        offsetX = 10; offsetY = 10 + (tileSize * 7); interator = 0;
        for (const cardAttr in cartasFinalMap) {
            const x = interator * (tileSize * 4) + offsetX;
            cartas.push(new Carta(x, offsetY, cartasFinalMap[cardAttr]));
            interator++;
        }

        class Mao {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.cartas = [];
                this.totalCartas = 10;
                for (let i = 0; i < this.totalCartas; i++)
                    this.addCard()
            }

            draw() {
                this.cartas.forEach(item => item.update());

                const offsetX = this.x - ((this.totalCartas * (tileSize * 4)) / 2);
                const x = this.cartas.length * (tileSize * 4) + offsetX;
                ctx.fillStyle = 'rgb(0,255,0)';
                ctx.fillRect(x, this.y, 30, 30)
            }

            addCard() {
                // const rand = 2
                const rand = Math.floor(Math.random() * cartas.length);
                const carta = cartas[rand];
                const offsetX = this.x - ((this.totalCartas * carta.width) / 2);
                const x = this.cartas.length * (tileSize * 4) + offsetX;
                this.cartas.push(new Carta(x, this.y, carta.map));
            }
        }

        const mao = new Mao(canvas.width / 2, canvas.height - (tileSize * 7));

        class Tabuleiro {
            constructor(saidas = 5) {
                this.x = 15;
                this.y = 155;
                this.width = canvas.width - 30;
                this.height = canvas.height - 240;
                this.cartasNaMesa = []

                const centerX = this.x + this.width / 2
                const centerY = this.y + this.height / 2
                // let cartaBandido = cartasBandidoMap.bandido5;
                let cartaBandido = cartasBandidoMap.bandido51;
                // if (saidas == 6)
                //     cartaBandido = cartasBandidoMap.bandido6;
                this.cartasNaMesa.push(new Carta(centerX, centerY, cartaBandido));

                this.possiveisConexoes = [];
            }

            draw() {
                ctx.fillStyle = 'red';
                ctx.fillRect(10, 150, canvas.width - 20, canvas.height - 230)
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                this.cartasNaMesa.forEach(item => item.update(true));
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                this.possiveisConexoes.forEach(item => ctx.fillRect(item.x, item.y, item.width, item.height))
            }

            update() {
                if (cartaSelecionada) {
                    this.possiveisConexoes = [];

                    const slrow = cartaSelecionada.lastRow();

                    this.cartasNaMesa.forEach(item => {
                        const mfrow = item.firstRow()
                        // let match = item.compareArrays(mfrow, slrow);
                        // if (match)
                            this.possiveisConexoes.push({
                                x: item.x,
                                y: item.y + item.height,
                                height: item.height,
                                width: item.width
                            })
                        // for (let i = 0; i < match.length; i++)
                        //     this.possiveisConexoes.push({
                        //         x: match[i],
                        //         y: 0
                        //     })

                    })
                }

                this.draw()
            }

            isMouseOver() {
                if (mouse.x > this.x && mouse.x < this.x + this.width &&
                    mouse.y > this.y && mouse.y < this.y + this.height)
                    return true;
                else
                    return false;
            }

            addCard(cartaDaMao, cartaDaMesa) {
                const x = cartaDaMesa.x + cartaDaMesa.width
                const y = cartaDaMesa.y //+ cartaDaMesa.height
                this.cartasNaMesa.push(new Carta(x, y, cartaDaMao.map));
            }
        }

        const tabuleiro = new Tabuleiro();

        function animate() {
            requestAnimationFrame(animate);

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            cartas.forEach(item => {
                item.update()
            })

            tabuleiro.update();
            mao.draw();
        }
        animate()

    </script>
</body>

</html>
