<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script src="cartas.js"></script>
</head>

<body>
    <canvas></canvas>

    <script>

        const canvas = document.querySelector('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 600;

        const cartas = [];
        const tileSize = 10;

        const mouse = {
            x: undefined,
            y: undefined,
            // press: false
        }
        // canvas.addEventListener('mouseup', (e) => mouse.press = false)
        canvas.addEventListener('mousedown', (e) => {
            const cardSelected = mao.cartas.find(x => x.selected);
            if (cardSelected)
                cardSelected.toggleSelect();
            const card = mao.cartas.find(x => x.isMouseOver());
            if (card)
                card.toggleSelect()
        })
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        })

        class Carta {
            constructor(x, y, mapa) {
                this.x = x;
                this.y = y;
                this.map = mapa;

                const h = mapa.length;
                const w = mapa[0].length;
                this.width = (w * tileSize) + tileSize;
                this.height = (h * tileSize) + tileSize;

                this.selected = false
            }

            draw() {
                // const size = this.selected ? tileSize * 2 : tileSize
                for (let i = 0; i < this.map.length; i++) {
                    const row = this.map[i];
                    for (let j = 0; j < row.length; j++) {
                        const tile = row[j];

                        const x = this.x + j * tileSize;
                        let y = this.y + i * tileSize;

                        if (this.selected)
                            y -= 20

                        ctx.fillStyle = tile == 0 ? 'brown' : tile == 1 ? 'red' : 'blue';
                        ctx.fillRect(x, y, tileSize, tileSize)
                    }
                }
            }

            update() {
                // if (this.isMouseOver() && mouse.press)
                //     this.selected = true;
                // else
                //     this.selected = false;
                this.draw()
            }

            toggleSelect() {
                this.selected = !this.selected;
            }

            isMouseOver() {
                if (mouse.x > this.x && mouse.x < this.x + this.width &&
                    mouse.y > this.y && mouse.y < this.y + this.height)
                    return true;
                else
                    return false;
            }
        }

        let offsetX = 10, offsetY = 10, interator = 0;
        for (const cardAttr in cartasMap) {
            const x = interator * (tileSize * 4) + offsetX;
            cartas.push(new Carta(x, offsetY, cartasMap[cardAttr]));
            interator++;
        }

        offsetX = 10; offsetY = 10 + (tileSize * 7); interator = 0;
        for (const cardAttr in cartasFinalMap) {
            const x = interator * (tileSize * 4) + offsetX;
            cartas.push(new Carta(x, offsetY, cartasFinalMap[cardAttr]));
            interator++;
        }

        class Mao {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.cartas = [];
                this.totalCartas = 10;
                for (let i = 0; i < this.totalCartas; i++)
                    this.addCard()
            }

            draw() {
                this.cartas.forEach(item => item.update());
            }

            addCard() {
                const rand = Math.floor(Math.random() * cartas.length);
                const carta = cartas[rand];
                const offsetX = this.x - ((this.totalCartas * carta.width) / 2);
                let x = this.cartas.length * (tileSize * 4) + offsetX;
                this.cartas.push(new Carta(x, this.y, carta.map));
            }
        }

        const mao = new Mao(canvas.width / 2, canvas.height - (tileSize * 7));

        function animate() {
            requestAnimationFrame(animate);

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            cartas.forEach(item => {
                item.update()
            })

            mao.draw();
        }
        animate()

    </script>
</body>

</html>
